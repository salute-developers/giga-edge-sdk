<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title">
  <title id="title">The host gives the manager parts and features; the manager builds and switches submodel versions in the runtime and answers with an UpdateAction</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .tiny{font-size:10px}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    .bg{fill:#fff;stroke:#d0d7de}
    .panel{fill:#fff;stroke:#d0d7de}
    .host{fill:#f6f8fa;stroke:#8c959f}
    .chip{fill:#f6f8fa;stroke:#d0d7de}
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:5 4}
    .card{fill:#fff;stroke:#0969da;stroke-width:1.5}
    .slot{fill:#fff;stroke:#0969da;stroke-width:1.5;stroke-dasharray:5 4}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .val{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .off{fill:#f6f8fa;stroke:#afb8c1}
    .feat{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
    .warn{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
    .purple{fill:#8250df}
    .orange{fill:#bc4c00}
    .green{fill:#1a7f37}
    .muted{fill:#8c959f}
    .white{fill:#fff}
    .tagon{fill:#0969da}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .back{fill:none;stroke:#59636e;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{fill:none;stroke:#8c959f;stroke-width:1.2}
    .life{stroke:#afb8c1;stroke-dasharray:4 4}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="299" rx="12"/>

  <rect class="host" x="24" y="40" width="130" height="200" rx="10"/>
  <text class="b mid" x="89" y="64">host</text>
  <path class="edge" d="M154 100H248"/>
  <text class="note small mid" x="201" y="92">parts</text>
  <path class="edge" d="M154 140H248"/>
  <text class="note small mid" x="201" y="132">features</text>
  <path class="back" d="M250 190H156"/>
  <text class="mono small mid" x="202" y="182">UpdateAction</text>
  <rect class="card" x="250" y="40" width="220" height="200" rx="10"/>
  <text class="mono b mid" x="360" y="64">RuntimeManager</text>
  <text class="note small" x="264" y="92">parts</text>
  <rect class="val" x="264" y="100" width="48" height="22" rx="11"/>
  <text class="mono small mid" x="288" y="115">core</text>
  <rect class="val" x="318" y="100" width="72" height="22" rx="11"/>
  <text class="mono small mid" x="354" y="115">asr_pack</text>
  <text class="note small" x="264" y="146">features</text>
  <rect class="feat" x="264" y="154" width="36" height="22" rx="11"/>
  <text class="mono small mid purple" x="282" y="169">hq</text>
  <text class="note small mid" x="360" y="222">picks a version for every submodel</text>
  <path class="edge" d="M470 124H578"/>
  <text class="note small mid" x="524" y="114">builds and switches</text>
  <text class="note small mid" x="524" y="140">submodel versions</text>
  <rect class="frame" x="580" y="40" width="156" height="200" rx="10"/>
  <text class="note b" x="594" y="64">Runtime</text>
  <rect class="slot" x="594" y="78" width="128" height="60" rx="8"/>
  <text class="mono b" x="606" y="98">asr</text>
  <rect class="node" x="606" y="106" width="76" height="22" rx="11"/>
  <text class="mono small mid" x="644" y="121">asr_large</text>
  <rect class="slot" x="594" y="150" width="128" height="60" rx="8"/>
  <text class="mono b" x="606" y="170">tts</text>
  <rect class="node" x="606" y="178" width="56" height="22" rx="11"/>
  <text class="mono small mid" x="634" y="193">tts_v1</text>
  <path class="edge" d="M89 240V262Q89 272 99 272H648Q658 272 658 262V242"/>
  <text class="mono small mid" x="372" y="264">Model(): Push, Subscribe</text>
</svg>
