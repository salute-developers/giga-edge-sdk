<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title">
  <title id="title">A batch output emits several values, each one is processed separately, a batch input collects them</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    .bg{fill:#fff;stroke:#d0d7de}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .val{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .lvl0{stroke:#8c959f;stroke-width:2}
    .lvl1{stroke:#1a7f37;stroke-width:2}
    .green{fill:#1a7f37}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="329" rx="12"/>

  <text class="b mid" x="215" y="34">batch output</text>
  <text class="note mid" x="215" y="51">one run pushes 1..N values</text>
  <text class="b mid" x="380" y="34">regular node</text>
  <text class="note mid" x="380" y="51">runs once per value</text>
  <text class="b mid" x="545" y="34">batch input</text>
  <text class="note mid" x="545" y="51">takes all of them at once</text>

  <rect class="node" x="30" y="125" width="120" height="70" rx="10"/>
  <text class="mono b mid" x="90" y="165">producer</text>

  <path class="edge" d="M150 160C178 160 172 95 199 95"/>
  <path class="edge" d="M150 160H199"/>
  <path class="edge" d="M150 160C178 160 172 225 199 225"/>

  <circle class="val" cx="215" cy="95" r="14"/>
  <text class="b mid" x="215" y="99.500">1</text>
  <circle class="val" cx="215" cy="160" r="14"/>
  <text class="b mid" x="215" y="164.500">2</text>
  <circle class="val" cx="215" cy="225" r="14"/>
  <text class="b mid" x="215" y="229.500">3</text>

  <path class="edge" d="M229 95H308"/>
  <path class="edge" d="M229 160H308"/>
  <path class="edge" d="M229 225H308"/>

  <rect class="node" x="310" y="75" width="140" height="40" rx="8"/>
  <text class="mono b mid" x="368" y="99.500">worker</text>
  <text class="note small end" x="440" y="99">run 1</text>
  <rect class="node" x="310" y="140" width="140" height="40" rx="8"/>
  <text class="mono b mid" x="368" y="164.500">worker</text>
  <text class="note small end" x="440" y="164">run 2</text>
  <rect class="node" x="310" y="205" width="140" height="40" rx="8"/>
  <text class="mono b mid" x="368" y="229.500">worker</text>
  <text class="note small end" x="440" y="229">run 3</text>

  <path class="edge" d="M450 95H529"/>
  <path class="edge" d="M450 160H529"/>
  <path class="edge" d="M450 225H529"/>

  <circle class="val" cx="545" cy="95" r="14"/>
  <text class="b mid" x="545" y="99.500">1′</text>
  <circle class="val" cx="545" cy="160" r="14"/>
  <text class="b mid" x="545" y="164.500">2′</text>
  <circle class="val" cx="545" cy="225" r="14"/>
  <text class="b mid" x="545" y="229.500">3′</text>

  <path class="edge" d="M559 95C587 95 580 148 608 148"/>
  <path class="edge" d="M559 160H608"/>
  <path class="edge" d="M559 225C587 225 580 172 608 172"/>

  <rect class="node" x="610" y="125" width="120" height="70" rx="10"/>
  <text class="mono b mid" x="670" y="165">collector</text>

  <text class="note mid" x="215" y="264" style="font-size:18px">…</text>
  <text class="note mid" x="380" y="264" style="font-size:18px">…</text>
  <text class="note mid" x="545" y="264" style="font-size:18px">…</text>

  <path class="lvl0" d="M30 296H183M30 290V302"/>
  <path class="lvl1" d="M183 296H577M183 290V302M577 290V302"/>
  <path class="lvl0" d="M577 296H730M730 290V302"/>
  <text class="note mid" x="106" y="318">nesting level 0</text>
  <text class="note mid green" x="380" y="318">nesting level 1</text>
  <text class="note mid" x="654" y="318">nesting level 0</text>
</svg>
