<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title">
  <title id="title">The host pushes data and events into the runtime graph and subscribes to its outputs; nodes run in a thread pool</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bc4c00"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    .bg{fill:#fff;stroke:#d0d7de}
    .host{fill:#f6f8fa;stroke:#8c959f}
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:5 4}
    .sub{fill:#fff;stroke:#0969da;stroke-width:1.5;stroke-dasharray:5 4}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .evedge{fill:none;stroke:#bc4c00;stroke-width:1.5;marker-end:url(#ao)}
    .ev{fill:#fff1e5;stroke:#bc4c00}
    .orange{fill:#bc4c00}
    .tap{fill:#59636e}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="349" rx="12"/>

  <rect class="host" x="24" y="22" width="712" height="38" rx="8"/>
  <text class="b mid" x="380" y="46">host application</text>

  <rect class="frame" x="24" y="108" width="712" height="186" rx="10"/>
  <text class="note b" x="130" y="131">Runtime</text>

  <path class="edge" d="M64 60V156Q64 166 74 166H128"/>
  <path class="edge" d="M44 60V236Q44 246 54 246H128"/>
  <text class="mono" x="74" y="89" style="font-size:12px">Push</text>
  <text class="mono small mid" x="99" y="159">input_1</text>
  <text class="mono small mid" x="90" y="239">input_2</text>

  <rect class="node" x="130" y="146" width="90" height="40" rx="8"/>
  <text class="mono b mid" x="175" y="170.500">node a</text>
  <rect class="node" x="130" y="226" width="90" height="40" rx="8"/>
  <text class="mono b mid" x="175" y="250.500">node b</text>

  <path class="edge" d="M220 166H298"/>
  <path class="edge" d="M220 246H298"/>

  <rect class="sub" x="300" y="140" width="150" height="132" rx="10"/>
  <text class="note small" x="312" y="158">submodel</text>
  <rect class="node" x="335" y="168" width="80" height="30" rx="6"/>
  <rect class="node" x="335" y="226" width="80" height="30" rx="6"/>
  <path class="edge" d="M375 198V224"/>

  <path class="edge" d="M450 206H538"/>
  <rect class="node" x="540" y="186" width="90" height="40" rx="8"/>
  <text class="mono b mid" x="585" y="210.500">node c</text>

  <circle class="tap" cx="260" cy="166" r="3"/>
  <path class="edge" d="M260 166V62"/>
  <text class="mono" x="270" y="89" style="font-size:12px">Subscribe</text>
  <path class="edge" d="M630 206H680Q690 206 690 196V62"/>
  <text class="mono end" x="680" y="89" style="font-size:12px">Subscribe</text>

  <path class="evedge" d="M520 60V118"/>
  <text class="mono orange end" x="510" y="89" style="font-size:12px">PushEvent</text>
  <rect class="ev" x="480" y="120" width="80" height="22" rx="11"/>
  <text class="small mid orange" x="520" y="135">events</text>
  <text class="note small" x="568" y="135">to every node</text>

  <rect class="host" x="24" y="306" width="712" height="30" rx="8"/>
  <text class="b" x="38" y="325.500" style="font-size:12px">thread pool</text>
  <rect class="node" x="130" y="311" width="78" height="20" rx="10"/>
  <text class="small mid" x="169" y="325">worker 1</text>
  <rect class="node" x="216" y="311" width="78" height="20" rx="10"/>
  <text class="small mid" x="255" y="325">worker 2</text>
  <text class="note end" x="722" y="325.500">runs the nodes (num_threads)</text>
</svg>
