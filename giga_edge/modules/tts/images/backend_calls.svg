<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-labelledby="title">
  <title id="title">The calls a backend receives: Initialize once; for every phrase SetVoice if the voice changed, StartSynthesis, GetAudioChunk until IsFinished is true, StopSynthesis; cancel and reset also end in StopSynthesis</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bc4c00"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .head{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
    .mid{text-anchor:middle}
    .bg{fill:#fff;stroke:#d0d7de}
    .call{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .loop{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:5 4}
    .ev{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
    .orange{fill:#bc4c00}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .oedge{fill:none;stroke:#bc4c00;stroke-width:1.5;marker-end:url(#ao)}
    .div{stroke:#d0d7de}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="261" rx="12"/>

  <text class="head mid" x="72" y="34">ONCE</text>
  <text class="head mid" x="448" y="34">FOR EVERY PHRASE</text>
  <line class="div" x1="140" y1="22" x2="140" y2="212"/>

  <rect class="call" x="24" y="94" width="96" height="32" rx="16"/>
  <text class="mono mid" x="72" y="114">Initialize</text>
  <text class="note small mid" x="72" y="144">when the node</text>
  <text class="note small mid" x="72" y="158">is created</text>

  <rect class="call" x="160" y="94" width="84" height="32" rx="16"/>
  <text class="mono mid" x="202" y="114">SetVoice</text>
  <text class="note small mid" x="202" y="144">if the voice</text>
  <text class="note small mid" x="202" y="158">changed</text>
  <path class="edge" d="M244 110H262"/>

  <rect class="call" x="264" y="94" width="126" height="32" rx="16"/>
  <text class="mono mid" x="327" y="114">StartSynthesis</text>
  <path class="edge" d="M390 110H408"/>

  <rect class="loop" x="410" y="50" width="190" height="120" rx="10"/>
  <rect class="call" x="445" y="62" width="120" height="30" rx="15"/>
  <text class="mono mid" x="505" y="81">IsFinished</text>
  <rect class="call" x="445" y="126" width="120" height="30" rx="15"/>
  <text class="mono mid" x="505" y="145">GetAudioChunk</text>
  <path class="edge" d="M480 92V124"/>
  <text class="note small" x="424" y="113">false</text>
  <path class="edge" d="M530 126V94"/>
  <text class="note small" x="538" y="113">again</text>
  <path class="edge" d="M600 110H618"/>
  <text class="note small mid" x="505" y="186">until IsFinished is true</text>

  <rect class="call" x="620" y="94" width="116" height="32" rx="16"/>
  <text class="mono mid" x="678" y="114">StopSynthesis</text>

  <rect class="ev" x="430" y="198" width="150" height="28" rx="14"/>
  <text class="mid orange" x="505" y="216" style="font-size:12px">cancel or reset</text>
  <path class="oedge" d="M580 212H678V128"/>

  <text class="note mid" x="380" y="248">Calls to one interpreter never overlap, but they may come from different threads.</text>
</svg>
