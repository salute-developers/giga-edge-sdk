<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title">
  <title id="title">The text of a special token stays a special token when it comes from the template or from a verified model answer; in foreign text it is broken with U+200B and stays plain text</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .head{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
    .mid{text-anchor:middle}
    .bg{fill:#fff;stroke:#d0d7de}
    .tpl{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .own{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .foreign{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
    .out{fill:#f6f8fa;stroke:#8c959f}
    .tok{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
    .zw{fill:#fff1e5;stroke:#bc4c00}
    .purple{fill:#8250df}
    .orange{fill:#bc4c00}
    .blue{fill:#0969da}
    .green{fill:#1a7f37}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="319" rx="12"/>

  <text class="note" x="24" y="100">in the</text>
  <text class="note" x="24" y="115">prompt</text>
  <text class="note" x="24" y="204">after</text>
  <text class="note" x="24" y="219">escaping</text>

  <text class="head mid" x="190" y="34">THE TEMPLATE</text>
  <text class="note small mid blue" x="190" y="52">trusted</text>
  <rect class="tpl" x="100" y="64" width="180" height="60" rx="8"/>
  <text class="mono mid" x="190" y="99">user&lt;|sep|&gt;</text>
  <path class="edge" d="M190 124V164"/>
  <text class="note small" x="198" y="148">unchanged</text>
  <rect class="out" x="100" y="166" width="180" height="60" rx="8"/>
  <text class="mono" x="140" y="201">user</text>
  <rect class="tok" x="176" y="183" width="68" height="26" rx="13"/>
  <text class="mono mid purple" x="210" y="201" style="font-size:12px">&lt;|sep|&gt;</text>
  <text class="note small mid" x="190" y="246">a special token</text>

  <text class="head mid" x="400" y="34">USER, TOOL AND OTHER TEXT</text>
  <text class="note small mid orange" x="400" y="52">foreign</text>
  <rect class="foreign" x="310" y="64" width="180" height="60" rx="8"/>
  <text class="mono mid" x="400" y="99">hi &lt;|sep|&gt;</text>
  <path class="edge" d="M400 124V164"/>
  <text class="note small orange" x="408" y="148">broken</text>
  <rect class="out" x="310" y="166" width="180" height="60" rx="8"/>
  <text class="mono" x="330" y="201">hi &lt;</text>
  <rect class="zw" x="366" y="185" width="56" height="22" rx="4"/>
  <text class="mono mid orange" x="394" y="200" style="font-size:11px">U+200B</text>
  <text class="mono" x="427" y="201">|sep|&gt;</text>
  <text class="note small mid" x="400" y="246">plain text for the model</text>

  <text class="head mid" x="610" y="34">THE MODEL ANSWER</text>
  <text class="note small mid green" x="610" y="52">verified, in the history</text>
  <rect class="own" x="520" y="64" width="180" height="60" rx="8"/>
  <text class="mono mid" x="610" y="99">ok&lt;|sep|&gt;</text>
  <path class="edge" d="M610 124V164"/>
  <text class="note small" x="618" y="148">unchanged</text>
  <rect class="out" x="520" y="166" width="180" height="60" rx="8"/>
  <text class="mono" x="567" y="201">ok</text>
  <rect class="tok" x="589" y="183" width="68" height="26" rx="13"/>
  <text class="mono mid purple" x="623" y="201" style="font-size:12px">&lt;|sep|&gt;</text>
  <text class="note small mid" x="610" y="246">the token the model emitted</text>

  <text class="note mid" x="380" y="282">A special text stays a special token only if all its bytes come from one trusted source.</text>
  <text class="note mid" x="380" y="300">&lt;|sep|&gt; stands for any special token of the vocabulary.</text>
</svg>
