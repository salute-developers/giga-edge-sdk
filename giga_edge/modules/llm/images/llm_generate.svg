<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title">
  <title id="title">llm_generate takes a dialogue request, renders the prompt, reuses the KV cache, generates with llama.cpp and streams chunks with the tool calls extracted</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .head{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#59636e}
    .mid{text-anchor:middle}
    .bg{fill:#fff;stroke:#d0d7de}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .port{fill:#fff;stroke:#0969da;stroke-width:1.5}
    .sep{stroke:#0969da;stroke-opacity:.35}
    .step{fill:#fff;stroke:#0969da;stroke-opacity:.6}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .in{fill:none;stroke:#59636e;stroke-width:1.2;marker-end:url(#a)}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="299" rx="12"/>

  <text class="head mid" x="118" y="34">INPUTS</text>
  <text class="head mid" x="642" y="34">OUTPUTS</text>

  <rect class="node" x="220" y="24" width="320" height="236" rx="10"/>
  <text class="mono b mid" x="380" y="50">llm_generate</text>
  <line class="sep" x1="220" y1="62" x2="540" y2="62"/>

  <rect class="step" x="250" y="76" width="260" height="30" rx="6"/>
  <text class="mid" x="380" y="96" style="font-size:12px">render the prompt by the template</text>
  <path class="in" d="M380 106V118"/>
  <rect class="step" x="250" y="120" width="260" height="30" rx="6"/>
  <text class="mid" x="380" y="140" style="font-size:12px">keep the part already in the KV cache</text>
  <path class="in" d="M380 150V162"/>
  <rect class="step" x="250" y="164" width="260" height="30" rx="6"/>
  <text class="mid" x="380" y="184" style="font-size:12px">compute the rest, generate (llama.cpp)</text>
  <path class="in" d="M380 194V206"/>
  <rect class="step" x="250" y="208" width="260" height="30" rx="6"/>
  <text class="mid" x="380" y="228" style="font-size:12px">cut tool calls out of the text</text>

  <path class="edge" d="M24 100H212"/>
  <text class="mono mid" x="118" y="92">assistant_request</text>
  <text class="note small mid" x="118" y="116">messages, tools, generation params</text>
  <circle class="port" cx="220" cy="100" r="5"/>

  <path class="edge" d="M24 160H212"/>
  <text class="mono mid" x="118" y="152">cancel</text>
  <text class="note small mid" x="118" y="176">optional: drops the generation</text>
  <circle class="port" cx="220" cy="160" r="5"/>

  <path class="edge" d="M24 220H212"/>
  <text class="mono mid" x="118" y="212">dialogue_reset</text>
  <text class="note small mid" x="118" y="236">optional: also clears the KV cache</text>
  <circle class="port" cx="220" cy="220" r="5"/>

  <circle class="port" cx="540" cy="120" r="5"/>
  <path class="edge" d="M546 120H736"/>
  <text class="mono mid" x="642" y="112">stream_chunk</text>
  <text class="note small mid" x="642" y="136">text deltas and tool calls,</text>
  <text class="note small mid" x="642" y="150">then the final chunk</text>

  <circle class="port" cx="540" cy="200" r="5"/>
  <path class="edge" d="M546 200H736"/>
  <text class="mono mid" x="642" y="192">llm_report</text>
  <text class="note small mid" x="642" y="216">optional: token counts and times</text>

  <text class="note mid" x="380" y="284">One request is one step of the dialogue; the answer leaves the node chunk by chunk.</text>
</svg>
