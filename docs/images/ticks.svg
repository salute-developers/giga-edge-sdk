<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256" role="img" aria-labelledby="title">
  <title id="title">One push into every graph input makes one tick; a node runs once per tick, when all its inputs of that tick are there</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    .bg{fill:#fff;stroke:#d0d7de}
    .chip{fill:#f6f8fa;stroke:#d0d7de}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .val{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .green{fill:#1a7f37}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .line{fill:none;stroke:#8c959f;stroke-width:1.2}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="255" rx="12"/>

  <text class="note" x="24" y="64">pushes into a</text>
  <text class="note" x="24" y="114">pushes into b</text>
  <text class="note" x="24" y="186">the node runs</text>
  <path class="line" d="M150 60H716M150 110H716" stroke-dasharray="2 4"/>
  <path class="line" d="M200 73L272 166M304 123V166"/>
  <path class="line" d="M330 73L452 166M484 123V166"/>
  <path class="line" d="M550 73L622 166M654 123V166"/>
  <circle class="val" cx="200" cy="60" r="13"/>
  <text class="mono small b mid" x="200" y="64">a1</text>
  <circle class="val" cx="304" cy="110" r="13"/>
  <text class="mono small b mid" x="304" y="114">b1</text>
  <rect class="node" x="256" y="168" width="68" height="32" rx="8"/>
  <text class="b mid" x="290" y="188.500" style="font-size:12px">tick 1</text>
  <circle class="val" cx="330" cy="60" r="13"/>
  <text class="mono small b mid" x="330" y="64">a2</text>
  <circle class="val" cx="484" cy="110" r="13"/>
  <text class="mono small b mid" x="484" y="114">b2</text>
  <rect class="node" x="436" y="168" width="68" height="32" rx="8"/>
  <text class="b mid" x="470" y="188.500" style="font-size:12px">tick 2</text>
  <circle class="val" cx="550" cy="60" r="13"/>
  <text class="mono small b mid" x="550" y="64">a3</text>
  <circle class="val" cx="654" cy="110" r="13"/>
  <text class="mono small b mid" x="654" y="114">b3</text>
  <rect class="node" x="606" y="168" width="68" height="32" rx="8"/>
  <text class="b mid" x="640" y="188.500" style="font-size:12px">tick 3</text>
  <path class="edge" d="M150 222H716"/>
  <text class="note end" x="716" y="240">time</text>
  <text class="note" x="24" y="240">The k-th push into every graph input makes tick k; a node runs once per tick, with all its inputs of it.</text>
</svg>
