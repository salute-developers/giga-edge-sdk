<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="title">
  <title id="title">One command downloads the dependencies, applies the patches, builds them and then builds the SDK</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0L0 5L10 10z" fill="#59636e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .b{font-weight:600}
    .note{font-size:12px;fill:#59636e}
    .small{font-size:11px}
    .mid{text-anchor:middle}
    .end{text-anchor:end}
    .bg{fill:#fff;stroke:#d0d7de}
    .panel{fill:#fff;stroke:#d0d7de}
    .host{fill:#f6f8fa;stroke:#8c959f}
    .chip{fill:#f6f8fa;stroke:#d0d7de}
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:5 4}
    .card{fill:#fff;stroke:#0969da;stroke-width:1.5}
    .node{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .val{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .tool{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
    .purple{fill:#8250df}
    .edge{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a)}
    .both{fill:none;stroke:#59636e;stroke-width:1.5;marker-end:url(#a);marker-start:url(#b)}
    .line{fill:none;stroke:#8c959f;stroke-width:1.2}
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="235" rx="12"/>

  <rect class="chip" x="24" y="22" width="712" height="30" rx="8"/>
  <text class="mono small" x="38" y="42">./tools/scripts/build_giga_edge.sh --target-os &lt;os&gt; --preset &lt;preset&gt;</text>

  <rect class="node" x="24" y="76" width="160" height="70" rx="10"/>
  <text class="b mid" x="104" y="99">download</text>
  <text class="note small mid" x="104" y="118">dependencies at</text>
  <text class="note small mid" x="104" y="133">pinned versions</text>
  <path class="edge" d="M184 111H206"/>
  <rect class="node" x="208" y="76" width="160" height="70" rx="10"/>
  <text class="b mid" x="288" y="99">patch</text>
  <text class="note small mid" x="288" y="118">the patches of the</text>
  <text class="note small mid" x="288" y="133">SDK are applied</text>
  <path class="edge" d="M368 111H390"/>
  <rect class="node" x="392" y="76" width="160" height="70" rx="10"/>
  <text class="b mid" x="472" y="99">build</text>
  <text class="note small mid" x="472" y="118">the dependencies</text>
  <path class="edge" d="M552 111H574"/>
  <rect class="val" x="576" y="76" width="160" height="70" rx="10"/>
  <text class="b mid" x="656" y="99">build</text>
  <text class="note small mid" x="656" y="118">the SDK</text>
  <text class="note small mid" x="656" y="133">and its tests</text>
  <path class="line" d="M472 146V166"/>
  <rect class="chip" x="392" y="166" width="160" height="26" rx="6"/>
  <text class="mono small mid" x="472" y="183">build_&lt;os&gt;/install/</text>
  <path class="line" d="M656 146V166"/>
  <rect class="chip" x="576" y="166" width="160" height="26" rx="6"/>
  <text class="mono small mid" x="656" y="183">build_&lt;os&gt;/giga_edge/</text>
  <text class="note mid" x="380" y="218">A repeated run reuses what is already downloaded and built.</text>
</svg>
